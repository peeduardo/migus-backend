name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Build da aplicação
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
  unit-tests:
    name: Testes Unitários + VCR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes VCR
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: |
          ./mvnw -B -ntp clean test \
          -Dtest="**/vcr/*Test,**/service/*Test,**/controller/*Test"

      - name: Upload relatórios Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  coverage:
    name: Cobertura JaCoCo + SonarCloud
    runs-on: ubuntu-latest
    needs: unit-tests

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar verify (unitários + ITs + JaCoCo)
        run: ./mvnw -B -ntp verify -Djacoco.check.skip=true

      - name: Analisar com SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B -ntp sonar:sonar \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

      - name: Upload relatório JaCoCo (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Comentar cobertura no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('target/site/jacoco/jacoco.xml', 'utf8');

            const sum = (regex) => [...xml.matchAll(regex)].reduce((a, m) => a + +m[1], 0);

            const missedLines   = sum(/<counter type="LINE" missed="(\d+)"/g);
            const coveredLines  = sum(/<counter type="LINE" missed="\d+" covered="(\d+)"/g);
            const missedBranch  = sum(/<counter type="BRANCH" missed="(\d+)"/g);
            const coveredBranch = sum(/<counter type="BRANCH" missed="\d+" covered="(\d+)"/g);

            const pctLine   = coveredLines  + missedLines   > 0
              ? (coveredLines   / (coveredLines   + missedLines)   * 100).toFixed(1) : 'N/A';
            const pctBranch = coveredBranch + missedBranch  > 0
              ? (coveredBranch  / (coveredBranch  + missedBranch)  * 100).toFixed(1) : 'N/A';

            const icon = parseFloat(pctLine) >= 80 ? '✅' : '⚠️';

            const body = [
              `## ${icon} Cobertura de Código — JaCoCo`,
              '',
              `| Métrica  | Cobertas | Perdidas | Cobertura |`,
              `|----------|----------|----------|-----------|`,
              `| Linhas   | ${coveredLines} | ${missedLines} | **${pctLine}%** |`,
              `| Branches | ${coveredBranch} | ${missedBranch} | **${pctBranch}%** |`,
              '',
              `> Gate mínimo configurado no \`pom.xml\`: **80% de linhas**`,
              `> 🔍 [Ver análise completa no SonarCloud](https://sonarcloud.io/project/overview?id=HLN-lobo_biblioteca)`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const c of comments) {
              if (c.body && c.body.includes('Cobertura de Código — JaCoCo')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
